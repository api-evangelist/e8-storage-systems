name: E8 Storage Systems
description: >-
  E8 Storage Systems was an Israeli enterprise storage startup that built rack-scale
  NVMe flash arrays, separating high-performance shared flash from compute so that
  data-intensive workloads could reach local-NVMe latency over the network. The company
  was backed by Accel and was acquired by Amazon; the acquisition was reported on
  2019-07-31. E8 no longer operates as an independent vendor and publishes no developer
  portal, documentation, or public API. Its historical domain, e8storage.com, is retained
  defensively but does not resolve: there are no address or mail records, and DMARC
  aggregate reports are directed to dmarc.amazon.com. This profile is retained in the
  API Evangelist network as a historical big-data and storage-infrastructure record with
  no active API surface to enrich.
