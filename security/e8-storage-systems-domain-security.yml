  cannot be reached over HTTPS. Authoritative nameservers are MarkMonitor and
  the DMARC aggregate/forensic reports are directed to dmarc.amazon.com, which
  is consistent with Amazon's 2019 acquisition of the company and its retention
  of the domain as a defensive registration.
